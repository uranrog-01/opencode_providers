name: Pages

# Publishes .\site to GitHub Pages, which is where the product page lives:
#   https://uranrog-01.github.io/opencode_providers/
#
# The site is plain HTML and CSS — there is nothing to build, so this only uploads
# the folder. `enablement: true` turns Pages on for the repository if it has never
# been switched on, so the first push is enough.
on:
  push:
    branches: ['main']
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-applied.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
